# Supabase pauses free-tier projects after ~7 days without activity.
# This sends one lightweight API request every 3 days to keep the demo backend awake.
name: Keep Supabase awake

on:
  schedule:
    - cron: '0 3 */3 * *' # 03:00 UTC every 3 days
  workflow_dispatch: # allow manual runs from the Actions tab

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            "$SUPABASE_URL/rest/v1/categories?select=id&limit=1" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY")
          echo "Supabase responded with HTTP $status"
          test "$status" = "200"
